# enhanced_helmet.yaml
# =====================
# Enhanced YOLOv8-nano for helmet / plate / motorcyclist detection.
#
# Three modifications over baseline YOLOv8n (from Chen et al., ISoIRS 2025):
#   1. C2f_FasterNet  — PConv-based blocks in backbone + neck  (lower FLOPs)
#   2. ADown          — replaces strided Conv downsampling      (preserves small targets)
#   3. LSCD_Detect    — shared-weight head with GroupNorm       (stable at batch=1)
#
# nc is set to 3 here (helmet, license_plate, motorcyclist).
# Change nc to match the exact number of classes in your data.yaml.

# Model scaling — nano parameters (matches yolov8n depth/width)
nc: 3          # ← set to number of classes in your helmet dataset
scales:
  n: [0.33, 0.25, 1024]   # depth, width, max_channels

# ── Backbone ──────────────────────────────────────────────────────────────────
# Uses C2f_FasterNet blocks and ADown downsampling instead of standard Conv.
#
# Layer format: [from, repeats, module, args]
backbone:
  - [-1, 1, Conv,          [64, 3, 2]]          # 0 - P1/2    320×320×64
  - [-1, 1, Conv,          [128, 3, 2]]         # 1 - P2/4    160×160×128
  - [-1, 3, C2f_FasterNet, [128, True]]         # 2           160×160×128
  - [-1, 1, ADown,         [256]]               # 3 - P3/8    80×80×256
  - [-1, 6, C2f_FasterNet, [256, True]]         # 4           80×80×256
  - [-1, 1, ADown,         [512]]               # 5 - P4/16   40×40×512
  - [-1, 6, C2f_FasterNet, [512, True]]         # 6           40×40×512
  - [-1, 1, ADown,         [1024]]              # 7 - P5/32   20×20×1024
  - [-1, 3, C2f_FasterNet, [1024, True]]        # 8           20×20×1024
  - [-1, 1, SPPF,          [1024, 5]]           # 9  SPPF     20×20×1024

# ── Neck ──────────────────────────────────────────────────────────────────────
# PANet + FPN bidirectional fusion.  C2f_FasterNet and ADown used here too.
head:
  - [-1,  1, nn.Upsample,    [None, 2, 'nearest']]   # 10   40×40
  - [[-1, 6], 1, Concat,     [1]]                    # 11   cat P4
  - [-1,  3, C2f_FasterNet,  [512]]                  # 12   40×40×512

  - [-1,  1, nn.Upsample,    [None, 2, 'nearest']]   # 13   80×80
  - [[-1, 4], 1, Concat,     [1]]                    # 14   cat P3
  - [-1,  3, C2f_FasterNet,  [256]]                  # 15   80×80×256  ← P3 out

  - [-1,  1, ADown,          [256]]                  # 16   40×40
  - [[-1, 12], 1, Concat,    [1]]                    # 17   cat
  - [-1,  3, C2f_FasterNet,  [512]]                  # 18   40×40×512  ← P4 out

  - [-1,  1, ADown,          [512]]                  # 19   20×20
  - [[-1, 9], 1, Concat,     [1]]                    # 20   cat P5
  - [-1,  3, C2f_FasterNet,  [1024]]                 # 21   20×20×1024 ← P5 out

  # LSCD_Detect: shared-weight head with GroupNorm across all 3 scales
  - [[15, 18, 21], 1, LSCD_Detect, [nc]]             # 22   detection output